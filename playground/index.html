<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>tailwindcss-fluid playground</title>
		<link rel="stylesheet" href="/src/app.css" />
	</head>
	<body>
		<!-- Fixture classes exercised by the M0 spike + Playwright verification. -->

		<!-- (6) clamp math on font-size, default viewport range -->
		<h1 id="viewport-type" class="fl-text-sm/xl">Fluid viewport type</h1>

		<!-- M2 sampling of the full root list across scale families -->
		<!-- spacing family (+ negative margin — padding has no core negative) -->
		<div class="fl-p-4/8 fl-mx-2/6 -fl-mt-3/5 fl-gap-2/6 fl-space-x-2/6">spacing</div>
		<!-- sizing -->
		<div class="fl-w-16/32 fl-h-8/16 fl-size-4/8 fl-max-w-24/48 fl-basis-8/16">sizing</div>
		<!-- type -->
		<div class="fl-leading-4/8 fl-indent-2/6 fl-tracking-[0.01rem]/[0.04rem]">type</div>
		<!-- decoration -->
		<div class="fl-rounded-lg/2xl fl-border-2/8 fl-outline-2/4 fl-ring-2/4">decoration</div>
		<!-- transform -->
		<div class="-fl-translate-x-2/6 fl-translate-y-1/4">transform</div>
		<!-- arbitrary values + px fold -->
		<div class="fl-p-[16px]/[2rem] fl-m-[0.5rem]/[1.5rem]">arbitrary</div>

		<!-- (3) viewport range variants -->
		<div class="fl-md/lg:fl-text-sm/xl">range md→lg</div>
		<div class="fl-md:fl-text-sm/xl">start only</div>
		<div class="fl/lg:fl-text-sm/xl">end only</div>

		<!-- (4)(6) container-query range variant + 100cqw swap -->
		<div id="container" style="container-type: inline-size; width: 800px">
			<h2 id="container-type" class="@fl-md/lg:fl-text-sm/xl">Fluid container type</h2>
		</div>

		<!-- (M3) element-scope containment: a ranged parent must NOT leak its range to
		     a child (proves the engine vars' `inherits: false`). The child uses the
		     default range, the parent the md→lg range, so their sizes differ. -->
		<div id="scope-parent" class="fl-md/lg:fl-text-sm/xl">
			ranged parent
			<span id="scope-child" class="fl-text-sm/xl">default-range child</span>
		</div>

		<!-- (M3) element-scope retune: one range variant retunes EVERY fluid utility on
		     the element — the padding (no variant of its own) is ranged md→lg too. -->
		<div id="scope-element" class="fl-md/lg:fl-text-sm/xl fl-p-4/8">retuned padding</div>

		<!-- (M3) last-in-cascade-wins: two range variants on one element don't compose;
		     the whole element takes one range (whichever wins the cascade). -->
		<div id="last-wins" class="fl-sm/md:fl-text-sm/xl fl-lg/2xl:fl-text-sm/xl">last wins</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
