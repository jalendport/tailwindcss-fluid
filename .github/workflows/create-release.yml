name: create-release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull the release notes straight from CHANGELOG.md: extract the section whose
      # heading matches the tag (minus the leading `v`), stopping at the next `## `.
      # Fail the run if that section is missing — write the release notes (rename
      # `## Unreleased` to `## <version>`) before tagging.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "([ ]|$)" { flag = 1; next }
            /^## / { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version — write the release notes before tagging."
            exit 1
          fi
          cat release-notes.md

      # No npm publish step: publishing is deferred until the package-name decision
      # is made (the placeholders `tailwindcss-fluid` / `@tailwindcss-fluid/tailwind-merge`
      # are not yet claimed). Add the publish job here once the names are settled.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
